<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 96" role="img"
     aria-label="What this site is about: social media campaigns, team building, leadership, and hand-built web pages">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3effa"/>
      <stop offset="1" stop-color="#f3f8fd"/>
    </linearGradient>
  </defs>
  <rect width="470" height="96" rx="9" fill="url(#hb)"/>

  <!-- 1. Campaigns -->
  <g transform="translate(22,14)">
    <rect width="42" height="42" rx="10" fill="#1d6fb8"/>
    <path d="M12 16h9l4-4h4l4 4h9v16H12z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="21" cy="24" r="5" fill="none" stroke="#fff" stroke-width="2.4"/>
  </g>
  <text x="43" y="76" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"
        fill="#14202b" text-anchor="middle">Campaigns</text>

  <!-- 2. Team building -->
  <g transform="translate(135,14)">
    <rect width="42" height="42" rx="10" fill="#0f7a4f"/>
    <circle cx="16" cy="16" r="5" fill="#fff"/>
    <circle cx="27" cy="16" r="5" fill="#fff" opacity="0.72"/>
    <path d="M7 33c0-5.5 4-9 9-9s9 3.5 9 9z" fill="#fff"/>
    <path d="M19 33c0-5.5 4-9 9-9s9 3.5 9 9z" fill="#fff" opacity="0.72"/>
  </g>
  <text x="156" y="76" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"
        fill="#14202b" text-anchor="middle">Teams</text>

  <!-- 3. Leadership -->
  <g transform="translate(248,14)">
    <rect width="42" height="42" rx="10" fill="#b8500f"/>
    <path d="M21 9l3.6 7.6 8.4 1.1-6 6 1.4 8.3L21 28l-7.4 4 1.4-8.3-6-6 8.4-1.1z" fill="#fff"/>
  </g>
  <text x="269" y="76" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"
        fill="#14202b" text-anchor="middle">Leadership</text>

  <!-- 4. Built by hand -->
  <g transform="translate(361,14)">
    <rect width="42" height="42" rx="10" fill="#1b3a5c"/>
    <path d="M16 14l-6 7 6 7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 14l6 7-6 7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="382" y="76" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold"
