  <rect x="362" y="200" width="150" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
  <text x="360" y="246" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" opacity="0.92">Campaigns, teams, leadership, and this site</text>
